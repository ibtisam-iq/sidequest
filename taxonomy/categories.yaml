# sidequest taxonomy registry
#
# An arbitrary-depth tree, not a flat list. Categories grow with the directory - nothing here
# is a fixed enum.
#
#   slug    kebab-case identifier; must match the folder name under data/
#   name    human-readable display name
#   parent  omitted for a top-level category; otherwise the FULL PATH of the immediate parent
#           (e.g. `technology`, or `technology/dev-tools` for something nested one level
#           deeper still) - not just its bare slug. This is what lets depth be unbounded
#           without ambiguity: two categories under different branches may reuse a slug.
#
# The SIX TOP-LEVEL ROOTS are fixed, durable life-domain categories, not
# implementation categories or trend words: Career, Faith, Finance, Learning, Lifestyle,
# Technology. Nav order is always alphabetical - no manual reordering by perceived importance.
# There is deliberately no "AI" root; AI-related entries live under Technology as subcategories.
# See CLAUDE.md for the classification precedence rule used to place an entry among these six
# when it could plausibly fit more than one.
#
# Depth below a root is unbounded - a category may itself have children, which may have their
# own, and so on. The site's top nav (the mega-menu) only ever shows a root's immediate children
# on hover/tap regardless of how deep the tree goes underneath; deeper levels are reached by
# clicking into a category page and browsing further. A subcategory named after its old flat
# top-level category (e.g. `dev-tools`, `ai-tools`) is a generic bucket for entries that don't
# fit a more specific sibling - not a sign the hierarchy needs to be deeper.
#
# Entry counts are NOT stored. They are computed at build time by the site and by
# `npm run validate -- --report`. Storing them would put every single-entry PR on the same line
# of this file and guarantee merge conflicts between concurrent contributions.
#
# Adding a category: use `npm run add-link`, which normalizes the slug
# and fuzzy-matches it against its SIBLINGS - other subcategories of the same parent, or other
# top-level categories if you're adding a new parent - not the whole registry. Adding by hand is
# fine too - just run `npm run validate` afterward.

