name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets a deploy be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so main always lands.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install script dependencies
        run: npm ci

      # Validation gates the deploy: a broken dataset must never reach the live site, and
      # failing here costs seconds instead of a full Astro build.
      - name: Validate dataset
        run: npm run validate

      # Caches any entry's favicon that arrived without one already committed - mainly
      # issue-form PRs, since the local CLIs cache theirs immediately when the entry is added.
      # Never fails the build: a dead site or missing icon just leaves that entry to fall back
      # to a letter initial, handled by Favicon.astro.
      - name: Fetch favicons
        run: npm run fetch-favicons

      # Persist anything newly fetched above, so the next deploy doesn't refetch the same icon
      # for an entry that only ever arrived via the issue-form path. The commit message carries
      # [skip ci], which GitHub recognises natively for push-triggered workflows - without it,
      # pushing here would trigger a second run of this very workflow, which would push again,
      # and so on. The current run is unaffected by that skip; it already has these files
      # checked out locally and continues on to build and deploy with them regardless of
      # whether the commit below succeeds.
      #
      # Never blocks the deploy: if the push races with something else and fails, the fetched
      # files still exist in this run's working directory and still ship in this build - the
      # only cost is that a future run may refetch the same icon, which is the pre-existing
      # behavior this step is trying to reduce, not a new failure mode.
      - name: Commit newly-cached favicons
        continue-on-error: true
        run: |
          if git status --porcelain -- site/public/favicons | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add site/public/favicons
            git commit -m "chore(favicons): cache newly fetched icons [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Nothing new to commit - everything was already cached."
          fi

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      # `npm run build` is `astro build && pagefind --site dist` - Pagefind indexes the built
      # HTML, so it has to run after Astro, and it is chained in package.json rather than here
      # so a local build produces exactly the same output.
      - name: Build site
        run: npm run build
        working-directory: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
