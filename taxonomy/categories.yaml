# sidequest taxonomy registry
#
# A two-level tree, not a flat list. Categories grow with the directory - nothing here is a
# fixed enum.
#
#   slug    kebab-case identifier; must match the folder name under data/
#   name    human-readable display name
#   type    links | companies
#   parent  omitted for a top-level category; set to a top-level slug for a subcategory
#
# For `links`, the SIX TOP-LEVEL ROOTS are fixed, durable life-domain categories, not
# implementation categories or trend words: Career, Faith, Finance, Learning, Lifestyle,
# Technology. Nav order is always alphabetical - no manual reordering by perceived importance.
# There is deliberately no "AI" root; AI-related entries live under Technology as subcategories.
# See CLAUDE.md for the classification precedence rule used to place an entry among these six
# when it could plausibly fit more than one.
#
# Only two levels are supported - a subcategory can never itself be a parent. A subcategory
# named after its old flat top-level category (e.g. `dev-tools`, `ai-tools`) is a generic bucket
# for entries that don't fit a more specific sibling - not a sign the hierarchy is deeper than
# two levels.
#
# For `companies`, the registry key is still the COUNTRY (mirroring data/companies/<country>/)
# and stays flat - `parent` is never set for a companies entry. Industry is free-form and not
# registered here. Companies are surfaced in the site under /career/companies, but that is a
# navigation/routing decision, not a taxonomy one - this registry is unaffected by it.
#
# Entry counts are NOT stored. They are computed at build time by the site and by
# `npm run validate -- --report`. Storing them would put every single-entry PR on the same line
# of this file and guarantee merge conflicts between concurrent contributions.
#
# Adding a category: use `npm run add-link` / `npm run add-company`, which normalizes the slug
# and fuzzy-matches it against its SIBLINGS - other subcategories of the same parent, or other
# top-level categories if you're adding a new parent - not the whole registry. Adding by hand is
# fine too - just run `npm run validate` afterward.

